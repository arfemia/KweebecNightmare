plugins {
    id 'java'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

repositories {
    mavenCentral()
}

def hytaleServerJar = new File("${hytaleHome}/${patchline}/package/game/${game_build}/Server/HytaleServer.jar")

// The workspace's path map: family.properties at workspaceRoot (gradle.properties, relative to this
// project dir) names every family repo and pack by its path under that root. Read on first use.
def workspaceDir = rootProject.file(workspaceRoot)
def familyMap = null
def familyPath = { String key ->
    if (familyMap == null) {
        def mapFile = new File(workspaceDir, 'family.properties')
        if (!mapFile.isFile()) {
            throw new GradleException("no family.properties at ${workspaceDir.canonicalPath} (workspaceRoot=${workspaceRoot} in gradle.properties)")
        }
        familyMap = new Properties()
        mapFile.withReader('UTF-8') { familyMap.load(it) }
    }
    String rel = familyMap.getProperty(key)?.trim()
    if (!rel) {
        throw new GradleException("family.properties at ${workspaceDir.canonicalPath} has no ${key}")
    }
    new File(workspaceDir, rel)
}

// Ziggfreed Common: the sibling repo's build output (repo.ziggfreed-common in the path map) at the
// pinned ziggfreedCommonVersion; -PziggfreedCommonJar=<path> overrides it.
def ziggfreedCommonJar = findProperty('ziggfreedCommonJar')
        ? file(findProperty('ziggfreedCommonJar'))
        : new File(familyPath('repo.ziggfreed-common'), "build/libs/ZiggfreedCommon-${ziggfreedCommonVersion}.jar")

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation(files(hytaleServerJar))
    implementation project(':api')
    implementation 'com.google.code.gson:gson:2.10.1'

    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    // Perfect Utils (hard runtime dep, manifest Dependencies): compileOnly so AggroAPI
    // (com.narwhals.perfectutils.api.AggroAPI) compiles. The server provides the jar at
    // runtime (loaded first), so we NEVER bundle it - bundling would double-load AggroAPI
    // under two classloaders. Path in gradle.properties (perfectUtilsJar).
    compileOnly files(perfectUtilsJar)

    // Ziggfreed Common (hard runtime dep, manifest Dependencies, loads first): compileOnly
    // so com.ziggfreed.common.* (Sound3D, ...) compiles. The server provides the jar at
    // runtime, so we NEVER bundle it - bundling would double-load its engine-touching
    // classes under two classloaders. Resolved above through the workspace's path map.
    compileOnly files(ziggfreedCommonJar)

    // Test-only: unit tests decode shipped asset JSON through common's codecs (e.g.
    // ChaseLootableLoadTest) and need the server + common classes on the TEST
    // classpath specifically, since both are compileOnly for main (mirrors mmo-mob-scaling
    // and rpg-stations' own test wiring).
    testImplementation(files(hytaleServerJar))
    testImplementation(files(ziggfreedCommonJar))
}

// Bundle the :api module classes into the plugin jar (excluding service files so the
// engine does not double-register).
configurations {
    apiBundle
}

dependencies {
    apiBundle project(':api')
}

jar {
    dependsOn ':api:jar'

    from({
        configurations.apiBundle.collect { zipTree(it) }
    }) {
        exclude 'META-INF/services/**'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

// Never call a deprecated engine API (family-wide rule, hyMMO's
// .claude/rules/java-conventions.md): -Xlint:removal surfaces every Hytale API annotated @Deprecated(forRemoval = true)
// still in use, and -Werror promotes that warning to a hard compile failure, mirroring the hyMMO
// jar's own compileJava flag. A future Hytale server update that deprecates-for-removal an API
// this mod calls will now fail the build on sight instead of silently degrading toward a removed
// API. compileJava only (not compileTestJava), matching the hyMMO jar's own scoping. A plain
// @Deprecated call compiles green here: gradle/deprecation-gate.gradle, applied below (and by
// api/build.gradle) and run by `check`, compiles every source set again with -Xlint:deprecation
// and fails on any such call not marked "// DEPRECATION-KEPT: <why>" (that flag stays off
// compileJava, whose -Werror would fail a marked call too). The gate file is hyMMO's, copied byte
// for byte: change it there and copy it here.
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

apply from: "$rootDir/gradle/deprecation-gate.gradle"

test {
    useJUnitPlatform()
}

processResources {
    var expandProps = [
            'name'           : project.name,
            'version'        : project.version,
            'group'          : project.group,
            'mod_description': project.findProperty('mod_description') ?: '',
            'website'        : project.findProperty('website') ?: '',
            'entry_point'    : project.findProperty('entry_point') ?: ''
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
