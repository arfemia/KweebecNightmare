group=ziggfreed
name=KweebecNightmare
version=1.2.1
api_version=1.0.0
java_version=25
mod_description=Kweebec Nightmare - a standalone co-op horror chase minigame in a Void-blighted Emerald Grove. Relight the grove-shrines while a Blighted Kweebec hunts you, then escape through the Heartwood Gate.
website=https://mmo-skill-tree-docs.ziggfreed.com
game_build=latest
entry_point=com.ziggfreed.kweebec.KweebecNightmarePlugin

# Compile against the SAME jar the server runs (the launcher's install under
# D:/Games/Hytale, the current 0.6.x build the manifest's ServerVersion range
# targets) - a jar from another build drifts and causes runtime NoSuchMethodError.
# In a workspace, its family.properties' hytaleHome, patchline and game_build replace
# these (see build.gradle); these values serve a build of this repo alone.
hytaleHome=D:/Games/Hytale/install
patchline=release

# The workspace root, relative to this project dir: the folder whose family.properties maps every
# family repo and pack to its path. build.gradle resolves the ziggfreed-common jar through
# repo.ziggfreed-common there.
workspaceRoot=../..

# Perfect Utils (Group "narwhals", Name "Perfect Utils") - a HARD runtime dependency
# (manifest Dependencies). compileOnly so AggroAPI compiles; the server provides it at
# runtime (or the fat jar embeds it), so it is NEVER bundled by the plain source jar.
# build.gradle finds the jar in the Developer-Utils repo's build output (repo.Developer-Utils
# in the workspace's family.properties, build/libs) from the version below, like the
# ziggfreed-common jar; -PperfectUtilsJar=<path> still overrides it. Bump the version here
# if Developer-Utils bumps.
perfectUtilsVersion=1.2.0

# Ziggfreed Common (Group "Ziggfreed", Name "ZiggfreedCommon") - a HARD runtime
# dependency (manifest Dependencies, loads first). compileOnly against the sibling
# mod's built jar so com.ziggfreed.common.* compiles; the server provides it at
# runtime, so it is NEVER bundled (bundling double-loads its engine-touching classes
# under two classloaders). build.gradle finds the jar in the sibling repo's build output
# (repo.ziggfreed-common in the workspace's family.properties, build/libs) from the version
# below, so it resolves in whichever tree this one lives in - the main tree or a worktree -
# with no edit; -PziggfreedCommonJar=<path> still overrides it. Bump the version here
# when ziggfreed-common bumps, together with the manifest's ZiggfreedCommon floor.
ziggfreedCommonVersion=2.2.0

# Gradle itself, the same in every family repo so one daemon serves them all (a different value
# here starts a second daemon): projects build in parallel, task outputs go to the build cache
# (its folder is set in settings.gradle), a run whose build scripts and the files they read are
# unchanged reuses the configuration cache instead of configuring again, and an idle daemon exits
# after 30 minutes.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=1800000
